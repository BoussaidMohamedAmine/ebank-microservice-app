<div class="p-3">
  @if (accouts$ | async; as state){
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Balance</th>
        <th>Date</th>
        <th>Type</th>
        <th>CustomerId</th>
      </tr>
      </thead>

      <tbody>
        @for(acc of state.accounts ; track acc){
          <tr>
            <td>{{acc.id}}</td>
            <td>acc.balance</td>
            <td>{{acc.type}}</td>
            <td>{{acc.createdAt}}</td>
            <td>{{acc.customerId}}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
