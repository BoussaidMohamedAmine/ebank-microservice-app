spring.application.name=ebank-bot

#spring.ai.model.chat=openai
#spring.ai.openai.api-key=${GROQ_API_KEY}
#spring.ai.openai.base-url=https://api.groq.com/openai/v1
#spring.ai.openai.chat.model=openai/gpt-oss-20b
#spring.ai.openai.chat.temperature=0.1

# locally
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=granite4.1:8b

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8050

# Adresse du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.jersey.enabled=false
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.customer.endpoint=/mcp

spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8083
spring.ai.mcp.client.streamable-http.connections.account.endpoint=/mcp

spring.ai.openai.chat.extra-body.include_reasoning=false

discord.token=${DISCORD_TOKEN:}
telegram.token=${TELEGRAM_TOKEN:}

# Bots optionnels :
# - Telegram demarre seulement si TELEGRAM_TOKEN est defini
# - Discord demarre seulement avec le profil "discord" (--spring.profiles.active=discord)
spring.autoconfigure.exclude=com.zgamelogic.discord.components.DiscordBot,com.zgamelogic.discord.components.DiscordListener,com.zgamelogic.discord.components.DiscordDispatcher,com.zgamelogic.discord.services.IronWood
